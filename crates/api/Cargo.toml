[package]
name = "client-api"
version = "0.1.0"
edition = "2021"
publish = false

# REST-клиент Discord API: типы ответов, парсер сообщений, запросы с bearer-
# токеном. Без Tauri — состоянием управляет вызывающий (&DiscordState из
# client-core), команды Tauri живут в src-tauri.
[dependencies]
client-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "form"] }
tokio = { version = "1", features = ["rt"] }
log = "0.4"

# Пробники (examples/) — та же диагностика, что раньше жила в src-tauri.
[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
