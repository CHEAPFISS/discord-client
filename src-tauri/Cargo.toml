[package]
name = "discord-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tungstenite = "0.22"
url = "2"
log = "0.4"
env_logger = "0.11"

# Нативная WebRTC библиотека — подключим после выбора конкретной реализации
#пример: webrtc = { version = "0.9", features = ["audio", "video"] }

[build-dependencies]
tauri-build = { version = "2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
