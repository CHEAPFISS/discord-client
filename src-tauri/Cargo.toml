[package]
name = "discord-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }
url = "2"
log = "0.4"
env_logger = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
bytes = "1"
hex = "0.4"
# opus = { version = "0.1", optional = true }  # требует libopus в системе — подключим на этапе звука

# Нативная WebRTC библиотека — подключим после выбора конкретной реализации
#пример: webrtc = { version = "0.9", features = ["audio", "video"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
