# Workspace: единые зависимости, Cargo.lock и target/ для всех крейтов проекта.
# Tauri-клиент (src-tauri), egui-конструктор (tools/ui-tree) и вынесенный бэкенд
# (crates/*) собираются вместе — так они видят общие типы и версии крейтов.
[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/media",
    "src-tauri",
    "tools/ui-tree",
]
# Вендоренный форк oto — отдельный workspace со своими правилами наследования.
exclude = [
    "vendor",
]

[profile.dev]
opt-level = 1
# line-tables-only вместо полного debuginfo: линковка dev-бинарника
# заметно быстрее, а имён функций и строк в стектрейсах достаточно.
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# DSP-зависимости в debug-сборке: без оптимизации nnnoiseless не влезает в
# контракт poll (≤2 мс на кадр) — oto считает это сбоем и роняет отправку.
[profile.dev.package.nnnoiseless]
opt-level = 3
# fast_image_resize (даунскейл YUV в горячем пути видео): SIMD-свёртка на
# -O2 давала ~14 мс на кадр — на -O3 быстрее.
[profile.dev.package.fast_image_resize]
opt-level = 3
# cargo test работает в профиль test — продублируем override, иначе бенч
# daunskayla меряется на -O2/-O1 и врёт (Box: 15 мс вместо ~4).
[profile.test.package.fast_image_resize]
opt-level = 3
# Оптимизировать все зависимости (libopus, ring, …): unoptimized libopus тоже
# периодически вылезал за 2 мс CPU на кадр → FrameSourceContract каждый ~3 мин.
[profile.dev.package."*"]
opt-level = 2

# C-код openh264 компилируется build-скриптом (cc) и по умолчанию собирается
# вообще без оптимизации: 1080p в debug декодировался 67–127 мс на кадр —
# 30 fps недостижимы, очередь кадров рвалась. build-override задаёт opt-level
# для компиляции внутри build-скриптов (и их C-исходников).
[profile.dev.build-override]
opt-level = 3
