[package]
name = "ui-tree-probe"
version = "0.1.0"
edition = "2021"
publish = false

# glow (OpenGL), а не wgpu: для 2D-чата wgpu не нужен и тянет лишнюю память.
[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
